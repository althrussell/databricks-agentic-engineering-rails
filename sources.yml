# sources.yml — the exact public sources this pack relies on.
#
# Rules this file exists to enforce (see docs/07-documentation-standard.md):
#   1. Every entry is an exact URL that was fetched, never a wildcard or a
#      navigation section. A `*` in a source list is an unbounded corpus, not
#      a citation.
#   2. Every entry records the date its status was verified and the HTTP code
#      returned, so a reader can tell a live source from a stale one.
#   3. Repositories are pinned to a commit SHA. A branch name is not evidence.
#   4. Excluded candidates are listed with a reason. Silence is not a decision.
#
# Regenerate the status column with: make check-live

schema_version: 1
verified_on: "2026-09-15"
reverify_interval_days: 90
verification_method: >-
  HTTP GET with redirects followed, 25s timeout, recording the final status
  code. A 200 proves the page exists and is publicly reachable without
  authentication; it does not prove any particular claim on it. Claim-level
  evidence lives in claims-ledger.json.

