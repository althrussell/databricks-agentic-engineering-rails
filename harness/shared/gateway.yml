# gateway.yml — how each harness reaches Unity AI Gateway.
#
# Rendered into a per-harness `launch.sh` by harness/scripts/generate.sh. One
# template, five launchers, because the hard parts are identical and only the last
# line differs.
#
# Two things in this file are easy to get wrong and expensive to get wrong:
#
#   1. A route documented for the platform is not necessarily present on a given
#      workspace. On the workspace this pack was built against, the Anthropic route
#      answered 200 while the Codex route answered 404 and the Gemini route answered
#      400. Probe; do not assume. This is why every generated `launch.sh` checks the
#      route before starting the harness, and why `--explain` exists.
#   2. Attribution is not automatic. A session reaches the usage system table because
#      it went through the gateway, but it becomes findable *as this team's session*
#      only if a request tag was set. Untagged traffic is real spend with no owner.

schema_version: 1

# Prefer the launcher over hand-set environment variables, for one reason worth
# stating plainly: the launcher re-checks the workspace and refreshes the token, and a
# hand-set token expires mid-session with an error that reads like a model failure.
launcher:
  command: ug
  install: "uv tool install git+https://github.com/databricks/unity-gateway"
  alias: ucode
  refresh_flag: "--refresh"
  writes_user_scope_config: true
  writes_user_scope_config_note: >-
    `ug` writes the launcher's environment block into the user's own harness
    configuration — for Claude Code, `~/.claude/ucode-settings.json` and the `env`
    block of `~/.claude/settings.json`. That is correct for a person configuring their
    own laptop, which is who this pack is for. It is stated out loud in every
    generated launcher, and `DAER_NO_UG=1` takes the path that writes nothing, where
    one exists.

# Values a generated launcher needs that are not themselves gateway facts. They live
# here rather than in the generator so that harness/shared/ stays the only place a
# reviewer has to read to know what the generated files will say.
defaults:
  profile: DEFAULT
  profile_note: >-
    The Databricks CLI's own default profile name. A reference configuration that
    named someone's personal profile would work on one machine and confuse every other
    reader. Override per session with DAER_PROFILE or DATABRICKS_CONFIG_PROFILE.
  project_tag: rails-reference
  project_tag_note: >-
    The default value of the `project` request tag. A team changes it once; until they
    do, their spend is at least attributable to something specific rather than to
    nothing.
  journal_path: .daer/guard-journal.jsonl
  journal_path_note: >-
    Where a generated hook adapter records the never-automatic decisions it makes.
    Git-ignored: it is a local audit trail of one machine's sessions, and committing it
    would put one developer's command history in everyone's clone.
  request_tags:
    header: "Databricks-Ai-Gateway-Request-Tags"
    keys: [team, project, purpose]

# One block per harness. `route_verified` is the field to read first.
#
#   verified      this pack made a real call over this route and got a 200.
#   documented    the route is in the gateway documentation and was not exercised
#                 here. The launcher probes it, so a workspace that does not serve it
#                 says so in the first thirty seconds rather than at the first prompt.
#
# `env_only` says whether there is a known way to point the harness at the gateway
# with environment variables alone. Where there is not, the generated launcher refuses
# rather than starting an ungoverned session that looks governed.
harnesses:
  claude-code:
    display: Claude Code
    binary: claude
    ug_subcommand: "ug claude"
    route: "/ai-gateway/anthropic"
    probe_path: "/ai-gateway/anthropic/v1/models"
    route_verified: verified
    env_only: true
    env:
      ANTHROPIC_BASE_URL: "{host}{route}"
      ANTHROPIC_AUTH_TOKEN: "{token}"
      CLAUDE_CODE_USE_GATEWAY: "1"
    custom_headers_var: ANTHROPIC_CUSTOM_HEADERS
    extra_headers:
      x-databricks-use-coding-agent-mode: "true"
    model_pinning_note: >-
      ANTHROPIC_MODEL is deliberately left unset. The launcher does the same, and for a
      reason worth copying: setting it adds a duplicate row to the harness's own model
      picker on top of the family alias, and a raw Databricks model id is rejected
      client-side. Pin a model for one session with the harness's own flag instead.

  codex:
    display: Codex CLI
    binary: codex
    ug_subcommand: "ug codex"
    route: "/ai-gateway/codex/v1"
    probe_path: "/ai-gateway/codex/v1/models"
    route_verified: documented
    route_note: >-
      Returned 404 on the workspace this pack was built against, while the Anthropic
      route returned 200. Route availability is per workspace. The launcher probes it.
    env_only: true
    env:
      OPENAI_BASE_URL: "{host}{route}"
      OPENAI_API_KEY: "{token}"
    env_only_note: >-
      Written from the OpenAI-compatible convention Codex follows for a custom
      provider. Not exercised by this pack. If Codex ignores these, use `ug codex`,
      which configures the provider block in `~/.codex/config.toml` for you.

  cursor:
    display: Cursor CLI
    binary: cursor-agent
    ug_subcommand: "ug cursor"
    route: "/ai-gateway/cursor/v1"
    probe_path: "/ai-gateway/cursor/v1/models"
    route_verified: documented
    env_only: false
    env_only_note: >-
      `ug cursor` configures MCP only; model routing for Cursor is not handled by the
      launcher, and no environment variable for a custom model endpoint is documented.
      So this harness can be brought under governed MCP but its model spend is metered
      wherever your Cursor licence sends it. That is a real answer and the generated
      launcher says it rather than pretending otherwise.

  copilot-cli:
    display: GitHub Copilot CLI
    binary: copilot
    ug_subcommand: "ug copilot"
    route: "/ai-gateway/mlflow/v1"
    probe_path: "/ai-gateway/mlflow/v1/models"
    route_verified: documented
    route_note: >-
      Route shared with OpenCode in the gateway documentation. Which of the two routes
      Copilot CLI actually uses has not been verified here.
    env_only: false
    env_only_note: >-
      No documented environment variable points Copilot CLI at a custom model
      endpoint. Its MCP registration and its tool permissions are both configurable,
      so the tools come under governance and the model spend does not.

  opencode:
    display: OpenCode
    binary: opencode
    ug_subcommand: "ug opencode"
    route: "/ai-gateway/mlflow/v1"
    probe_path: "/ai-gateway/mlflow/v1/models"
    route_verified: documented
    env_only: false
    env_only_note: >-
      OpenCode takes a custom provider in `opencode.json` rather than from the
      environment, so there is nothing for an environment-only path to set. `ug
      opencode` writes that block; the generated `opencode.json` here carries the
      permission tiers and the MCP registration, which are the parts that do not
      depend on the provider.

# What a rate limit looks like from inside a session, so a reader recognises it rather
# than filing it as flakiness.
limits:
  http_status_on_limit: 429
  client_requirement: >-
    Back off. A retry-immediately loop against a QPM limit turns one throttled session
    into a sustained overage and makes the dashboard unreadable for everyone else on
    the service.
  budgets_are_not_caps: >-
    A gateway budget is near-real-time protection, not an invoice cap: enforcement is
    approximate, in-flight requests are not interrupted, and spend above the threshold
    is not refunded. Size it as an alarm.
