# permissions.yml — the three permission tiers, once, in a neutral vocabulary.
#
# Rendered per harness by harness/scripts/generate.sh. See harness/shared/README.md
# for the vocabulary and docs/02-harness-standard.md for the reasoning.
#
# The design defaults this file encodes, stated so a reviewer can check the rows
# against them:
#
#   1. Read-only unless a write is explicitly enabled.
#   2. Fail safe. On low confidence or on error, hold rather than proceed.
#   3. Every automated decision is journalled so it can be reviewed and overridden.
#
# Rule 3 is why the never-automatic tier is implemented as a guard script and not
# only as a list of deny patterns: a pattern that matches leaves no record, and a
# guard can write one.

schema_version: 1

default_mode: manual
default_mode_note: >-
  Sessions start in the mode that asks before acting. Two of the looser modes
  cannot be selected from a committed project settings file at all (see claim
  cc-defaultmode-project-limit), so a repository that wants them has to say so in
  its own documentation rather than assume the file will apply.

tiers:
  - id: auto-allow
    intent: >-
      Actions whose worst outcome is a wasted minute and a dirty working tree.
      Everything here is reversible with git and touches nothing outside the
      repository.
  - id: ask
    intent: >-
      Actions that leave the machine or become visible to someone else. The cost
      of a prompt is seconds; the cost of an unreviewed push is a conversation.
  - id: never-automatic
    intent: >-
      Actions no approval flow should make routine, because the failure is not
      recoverable by the person who approved it. These are denied by rule and by
      guard, and a human performs them by hand, outside the agent session.

capabilities:
  # ---------------------------------------------------------------- auto-allow --
  - id: read-project-files
    tier: auto-allow
    what: Read any file in the repository working tree
    capabilities: ["tool(Read)", "tool(Glob)", "tool(Grep)"]
  - id: edit-project-files
    tier: auto-allow
    what: Create and edit files inside the repository working tree
    capabilities: ["tool(Edit)", "tool(Write)", "tool(NotebookEdit)"]
    note: >-
      Scoped by the boundary, not by this rule. The path fence lives in
      boundary.yml because a permission rule that names paths is bypassable by a
      command that writes the same path a different way.
  - id: local-git
    tier: auto-allow
    what: Inspect and change local history, with nothing leaving the machine
    capabilities:
      - "shell(git status)"
      - "shell(git diff)"
      - "shell(git log)"
      - "shell(git show)"
      - "shell(git add)"
      - "shell(git commit)"
      - "shell(git switch)"
      - "shell(git restore)"
      - "shell(git stash)"
      - "shell(git worktree)"
  - id: build-and-test
    tier: auto-allow
    what: The project's own build, check and test entry points
    capabilities:
      - "shell(make check)"
      - "shell(make docs)"
      - "shell(make test)"
      - "shell(make e2e)"
      - "shell(make doctor)"
      - "shell(npm run)"
      - "shell(npm test)"
      - "shell(npm ci)"
      - "shell(pytest)"
      - "shell(uv run)"
      - "shell(python3 scripts/)"
  - id: read-platform-docs
    tier: auto-allow
    what: Fetch the public documentation this pack cites
    capabilities:
      - "net.fetch(docs.databricks.com)"
      - "net.fetch(developers.databricks.com)"
      - "net.fetch(code.claude.com)"
  - id: approved-mcp-reads
    tier: auto-allow
    what: The read-only tools on MCP servers this project registers
    capabilities:
      - "mcp(databricks.get_current_user)"
      - "mcp(databricks.get_table_stats_and_schema)"
      - "mcp(databricks.list_compute)"
    note: >-
      Named tool by tool rather than as `mcp(databricks.*)`. A server-wide allow
      is a standing grant to whatever the server adds next release, which is a
      supply-chain decision disguised as a convenience.

  # ----------------------------------------------------------------------- ask --
  - id: push-a-branch
    tier: ask
    what: Publish local commits to the remote
    capabilities: ["shell(git push)"]
  - id: open-a-draft-pr
    tier: ask
    what: Open a pull request as a draft, where a human decides what happens next
    capabilities: ["shell(gh pr create)"]
  - id: workspace-writes
    tier: ask
    what: Anything that changes state in the Databricks workspace
    capabilities:
      - "shell(databricks)"
      - "mcp(databricks.execute_sql)"
      - "mcp(databricks.manage_app)"
  - id: unclassified-shell
    tier: ask
    what: Every shell command not named in the auto-allow tier
    capabilities: ["tool(Bash)"]
    note: >-
      This is the catch-all, and the reason the auto-allow list is explicit
      rather than a wildcard with exceptions. Its presence in `ask` is what makes
      an unknown command prompt instead of proceeding.
  - id: unknown-mcp-tools
    tier: ask
    what: Any MCP tool not named in the auto-allow tier
    capabilities: ["mcp(*)"]

  # ------------------------------------------------------------ never-automatic --
  - id: rewrite-published-history
    tier: never-automatic
    what: Force-push, or any push that discards commits someone else may hold
    capabilities: ["shell(git push --force)", "shell(git push -f)"]
    guard_rule: force-push
  - id: merge-or-release
    tier: never-automatic
    what: Merge a pull request, mark one ready for review, or cut a release
    capabilities: ["shell(gh pr merge)", "shell(gh pr ready)", "shell(gh release create)"]
    guard_rule: merge-or-release
  - id: deploy
    tier: never-automatic
    what: Deploy to any target, including a bundle deployment to a named target
    capabilities: ["shell(databricks bundle deploy)", "shell(databricks bundle destroy)"]
    guard_rule: deploy
  - id: read-credentials
    tier: never-automatic
    what: Read a credential file, a token cache or a keychain
    capabilities: ["shell(security find-generic-password)"]
    guard_rule: credential-access
    note: >-
      The file paths are fenced in boundary.yml, where the boundary can enforce
      them for every command rather than for the spelling of one command.
  - id: message-a-person
    tier: never-automatic
    what: Send a message, e-mail or comment to a named individual
    capabilities: []
    guard_rule: message-a-person
    note: >-
      No rule string, because no tool in the reference configuration can do this.
      The guard rule exists so that adding such a tool cannot quietly make it
      automatic — the entry is here to be found by the next person who registers
      a messaging MCP server.
  - id: destructive-outside-repo
    tier: never-automatic
    what: Recursive deletion, or a write outside the repository working tree
    capabilities: []
    guard_rule: destructive-path
    note: >-
      Enforced by the guard on the command text and by the boundary on the
      filesystem. Two mechanisms because the first is defeated by an unusual
      spelling and the second is defeated by a missing sandbox.
