success_tests:
  - id: st-1
    statement: >-
      A team of five engineers who have never used a coding agent seriously can
      read the Field Guide, spend the core day on labs 00-05, and end that day
      with a governed harness, a passing CI pipeline, and one small change
      shipped to a Databricks App with real evidence attached to the PR.
    closed_by: humans
    artifact: "docs/01-field-guide.md plus labs/lab-00-doctor through labs/lab-05, and track-a-app/"
    automated_checks:
      - lab-completion-checks
      - pr-lane
      - app-deploy-smoke
    human_validation: validation/protocols/p1-core-day-cohort.md
    evidence: []
    owner: pack-maintainer
    revision_tested: none
    result: not-run
    notes: >-
      Needs five engineers who have not seen the material, a workspace they can
      deploy to, and a facilitator who does not answer questions the documents
      should answer. The build cannot recruit them. Next action: run protocol
      p1 with a real cohort and paste the observation sheets into
      validation/observation-sheets/.

  - id: st-2
    statement: >-
      A second project generated with scripts/new-project.sh reaches the defined
      productive checkpoint in under an hour with no further reading: harness
      launched through the gateway, one scoped change made, the PR lane green,
      an evidence record attached.
    closed_by: humans
    artifact: "scripts/new-project.sh and the starter-check CI job that runs the generated project's own `make check`"
    automated_checks:
      - starter-check
    human_validation: validation/protocols/p2-second-project-timed.md
    evidence: []
    owner: pack-maintainer
    revision_tested: none
    result: not-run
    notes: >-
      starter-check proves the generated project is internally sound; it cannot
      prove a person reaches the checkpoint in under an hour. That needs one
      timed run by someone who did not write the generator. Next action: run
      protocol p2 and record the wall-clock time and every point the runner had
      to look something up.

  - id: st-3
    statement: >-
      A platform admin who did not author the runbook can stand up the
      governance plane - budgets, rate limits, model services, MCP services,
      policies, dashboards - from the admin track in under a day, and see
      per-team spend and per-tool usage the same afternoon.
    closed_by: humans
    artifact: "docs/11-admin-runbook.md, admin/terraform/, admin/scripts/, admin/dashboards/, admin/sql/"
    automated_checks:
      - tofu-fmt-validate
      - admin-script-idempotence
    human_validation: validation/protocols/p3-admin-plane-walkthrough.md
    evidence: []
    owner: pack-maintainer
    revision_tested: none
    result: not-run
    notes: >-
      Account-level tasks are outside a workspace admin's reach and are marked
      as such in the runbook. The same-afternoon visibility claim also depends
      on usage-table freshness, which the documentation does not state
      (claims-ledger: gw-usage-freshness-unstated) and which this protocol is
      what actually measures. Next action: run protocol p3 with an admin who has
      not read the drafts.

  - id: st-4
    statement: >-
      A reader who will never clone the repository, run a lab or deploy a
      Databricks App can forward one PDF to their team and apply its standards
      to their own codebase the same week, with no dependency on anything this
      pack builds.
    closed_by: humans
    artifact: "docs/00-recommendations-and-practices.md, built as a standalone PDF with no repository cross-references"
    automated_checks:
      - standalone-digest-check
    human_validation: validation/protocols/p4-standalone-reader.md
    evidence: []
    owner: pack-maintainer
    revision_tested: none
    result: not-run
    notes: >-
      standalone-digest-check enforces the mechanical part - no links into the
      repository, no instruction that requires a clone. Whether the advice is
      actionable on someone else's codebase is a judgement only that reader can
      make. Next action: send the digest PDF to one team outside this workspace
      and collect protocol p4.

known_gaps:
  - id: g-container-runtime
    gap: >-
      No container runtime is installed on the build machine, so the isolated
      execution boundary for harness verification is a scratch HOME rather than
      a disposable container.
    impact: >-
      The harness proof is honest about what it isolates - configuration and
      credentials - but it does not isolate the filesystem or the network, so it
      is not the boundary the security document recommends for untrusted work.
    owner: pack-maintainer
    next_action: >-
      Install a rootless runtime and re-run the harness verification inside it,
      or keep the scratch HOME and publish the residual risks in
      docs/16-security-privacy-supply-chain.md with this gap referenced.
    tracked_as: docs/DECISIONS/0002-execution-boundary.md
