# release-readiness.yml — the traceability spine.
#
# Every success test the pack claims about itself lives here, with what
# implements it, what checks it, who owns it, the exact revision the recorded
# result came from, and the result. `make check` validates this file against
# schemas/release-readiness.schema.json and additionally rejects any `passed`
# row whose revision_tested is not the current HEAD.
#
# Read the result column literally. `not-run` is not a soft pass, and no row is
# marked `passed` because the thing it describes looks likely to work.

schema_version: 1
pack_version: 0.1.0-preview
release_status: PREVIEW

status_definitions:
  PREVIEW: >-
    Honestly incomplete. Workspace, admin or human-validation rows may be
    not-run, provided each one names the missing authority and the next action.
    A PREVIEW may not be advertised as production-ready and may not be used to
    claim the success test is met.
  RELEASE-READY: >-
    All four success tests passed against this release candidate. The workspace
    deployment, the real end-to-end path and the admin-plane proof are not
    not-run, and the human validations were performed by representative users
    rather than by the authoring agent, with identifiers redacted.

result_definitions:
  passed: >-
    Run against revision_tested, by verified_by, with the evidence listed. Both
    the revision and the evidence are required for this value.
  failed: Run and did not meet the stated bar. notes says what failed.
  not-run: >-
    Not attempted against this revision. notes says who has the authority or
    access it needs and what the next action is.
  expired: >-
    Passed against an older revision and not re-run since. Treated as unproven,
    not as a pass.

