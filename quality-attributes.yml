# quality-attributes.yml — the measurable non-functional contract for the
# reference application in track-a-app/.
#
# This is the completed reference instance the production-readiness document
# (docs/15-production-readiness.md) tells readers to copy and re-derive. Copy the
# structure. Do not copy the numbers: they were chosen for this application's
# journeys and blast radius, and a number you inherited is a number nobody owns.
#
# `make check` validates this file and fails when a critical journey names no
# target, when a met/not-met attribute carries no measurement, or when an
# exception is past its expiry date.

schema_version: 1

description: >-
  Non-functional targets for the Track A reference application: an internal
  Databricks App serving a curated read model over Unity Catalog with a small
  write path recorded in Lakebase.

target_selection: >-
  Every target below was derived from two questions, in this order. Who notices
  when this journey degrades, and what is the worst thing that happens while it
  is degraded? A journey whose failure is visible only to the person who
  triggered it gets a looser target than one whose failure blocks a team, and a
  journey that writes gets a stricter correctness target than one that reads.
  Latency figures were then set from the slowest environment the application is
  expected to run in - a 2X-Small warehouse with cold cache - rather than from
  the fastest one we could produce for a demonstration. Nothing here is a
  platform default and nothing here is an industry figure; each number is a
  decision that an owner can be argued out of.

critical_journeys:
  - id: cj-load-dashboard
    journey: >-
      A signed-in user opens the application and sees the curated read model for
      their own permission scope, with no stale-data warning.
    users: "internal analysts and engineers, tens per day"
    blast_radius: single-team
    targets: [qa-page-latency, qa-availability, qa-freshness, qa-authz-scope]

  - id: cj-submit-annotation
    journey: >-
      A user submits an annotation against a row of the read model; it is
      persisted, visible to the whole team on next load, and never silently lost.
    users: "internal analysts, a few writes per user per day"
    blast_radius: single-team
    targets: [qa-write-latency, qa-write-durability, qa-authz-scope]

  - id: cj-pipeline-refresh
    journey: >-
      The scheduled pipeline refreshes the read model from source tables without
      publishing a partial or schema-broken result.
    users: "every reader of the application, indirectly"
    blast_radius: workspace
    targets: [qa-freshness, qa-correctness-contract, qa-pipeline-cost]

  - id: cj-agent-session
    journey: >-
      An engineer runs a governed agent session through the gateway and the
      session is attributable to their team in the usage table.
    users: "the engineering team using the rails"
    blast_radius: cross-team
    targets: [qa-attribution, qa-rate-limit-behaviour]

attributes:
  - id: qa-page-latency
    attribute: latency
    target: >-
      p95 under 1500 ms and p99 under 3000 ms for the initial read-model render,
      measured at the app boundary with a warm warehouse and 10 concurrent users.
    measured_by: "track-a-app/tests/performance/ (k6 scenario, app boundary, 10 VU, 3 min)"
    enforcement: eval
    status: unmeasured
    rationale: >-
      Held as an eval rather than a gate because the number moves with warehouse
      state and the CI runner's network path, and a gate that fails for reasons
      the author cannot control teaches people to bypass gates.

  - id: qa-write-latency
    attribute: latency
    target: "p95 under 800 ms for annotation submit, measured at the app boundary."
    measured_by: "track-a-app/tests/performance/ (write scenario)"
    enforcement: eval
    status: unmeasured

  - id: qa-availability
    attribute: availability
    target: >-
      99.0% of successful page loads per calendar month during support hours,
      excluding declared platform maintenance. Errors counted at the app
      boundary, not at the browser.
    measured_by: "app request logs aggregated in admin/sql/app-availability.sql"
    enforcement: observed
    status: unmeasured
    rationale: >-
      99.0% is deliberately modest for an internal tool. It is achievable with a
      single-region app and no standby, which is what this application is; a
      higher figure would require infrastructure the reference deliberately does
      not have.

  - id: qa-freshness
    attribute: freshness
    target: >-
      The read model is no more than 60 minutes behind its source tables during
      support hours, and the application shows the model's own watermark rather
      than the current time.
    measured_by: "track-a-app/data-pipeline/tests/ freshness assertion plus the watermark shown in the UI"
    enforcement: gate
    status: unmeasured
    rationale: >-
      A gate, because a stale read model that looks current is the failure most
      likely to be believed. The gate is on the watermark being present and
      correct, which is testable offline, not on the live lag figure.

  - id: qa-correctness-contract
    attribute: correctness
    target: >-
      Zero rows published that violate the read model's declared contract: no
      nulls in key columns, no duplicate keys, row count within 20% of the
      previous successful run unless the run is explicitly marked a backfill.
    measured_by: "track-a-app/data-pipeline/tests/test_contract.py, run against the pipeline output before publish"
    enforcement: gate
    status: unmeasured

  - id: qa-write-durability
    attribute: correctness
    target: >-
      No acknowledged annotation is lost. An acknowledgement is returned only
      after the row is committed, and the resilience suite proves the failure
      path returns an error rather than a false acknowledgement.
    measured_by: "track-a-app/tests/resilience/ (Lakebase connection killed mid-write)"
    enforcement: gate
    status: unmeasured

  - id: qa-authz-scope
    attribute: security
    target: >-
      A user never sees a row their Unity Catalog grants exclude. Verified with
      two identities of different scope against the same request path, not by
      reading the query.
    measured_by: "track-a-app/tests/security/test_scope_isolation.py"
    enforcement: gate
    status: unmeasured
    rationale: >-
      A gate with no exception path. Every other target here can carry an
      expiring exception; this one cannot, because the compensating control for
      leaking another team's rows does not exist.

  - id: qa-pipeline-cost
    attribute: cost
    target: >-
      A scheduled refresh costs no more than 0.5 DBU-hours, and a run exceeding
      2x the trailing median triggers an alert rather than passing silently.
    measured_by: "system.billing.usage filtered to the pipeline, in admin/sql/pipeline-cost.sql"
    enforcement: observed
    status: unmeasured

  - id: qa-attribution
    attribute: operability
    target: >-
      100% of agent sessions run through the rails carry a team tag that appears
      in the request_tags column of the gateway usage table.
    measured_by: "labs/lab-07-cost-and-visibility completion check, against system.ai_gateway.usage"
    enforcement: observed
    status: unmeasured
    rationale: >-
      Observed rather than gated: the tag is set by the harness launcher, which
      CI can assert, but whether it arrives in the usage table can only be
      confirmed against a real workspace. The freshness of that table is not
      documented (claims-ledger: gw-usage-freshness-unstated), so the lab
      measures the delay rather than assuming it.

  - id: qa-rate-limit-behaviour
    attribute: operability
    target: >-
      The off-platform client backs off and retries on HTTP 429 rather than
      failing the caller, and surfaces the limit to the user after the final
      attempt instead of silently returning an empty result.
    measured_by: "track-b-service/tests/ (429 injected at the transport layer)"
    enforcement: gate
    status: unmeasured
    rationale: >-
      Gated with an injected 429 rather than a real one. Deliberately provoking
      a gateway rate limit in CI would be a load test against shared
      infrastructure, which is a cost other teams would pay for our test.

dependencies:
  - name: Unity Catalog source tables
    assumption: >-
      Source tables exist, are readable by the app's service principal, and
      their schema changes are additive within a release.
    on_failure: >-
      Observed: the pipeline contract test fails and the previous read model
      stays published. The application keeps serving the older watermark, which
      is visible to the user.
    tested_by: track-a-app/data-pipeline/tests/test_contract.py

  - name: SQL warehouse
    assumption: "A warehouse is running or can auto-start within the page latency budget."
    on_failure: >-
      Observed: first request after idle exceeds the p95 target while the
      warehouse starts. The application shows a starting state rather than an
      error.
    tested_by: track-a-app/tests/resilience/test_cold_warehouse.py

  - name: Lakebase instance
    assumption: "The database instance accepts connections and the app's role can write."
    on_failure: >-
      Observed: annotation submit returns a 503 with a retry hint; reads are
      unaffected because they do not touch Lakebase.
    tested_by: track-a-app/tests/resilience/

  - name: Unity AI Gateway
    assumption: >-
      The gateway route the harness uses exists on this workspace. Route
      availability is per workspace and must be probed, not assumed
      (claims-ledger: probe-gw-route-coverage).
    on_failure: >-
      Observed: the harness launcher reports the unavailable route by name and
      exits non-zero rather than falling back to a direct provider endpoint,
      which would leave the session ungoverned.
    tested_by: harness/scripts/ preflight test

recovery:
  rto: "4 hours during support hours for the application; the read model is rebuildable from source at any time."
  rpo: >-
    15 minutes for annotations, which is the Lakebase point-in-time recovery
    window used. Zero for the read model, because it is derived and can be
    recomputed rather than restored.
  backup_owner: pack-maintainer
  retention: "7 days point-in-time for the Lakebase instance; source tables are governed by their own retention, not by this application."
  restore_demonstrated:
    status: not-demonstrated
    note: >-
      Not yet exercised. A restore that has never been run is an assumption, and
      this row says so rather than inheriting confidence from the backup
      configuration. Closing it requires a real restore into an isolated branch,
      verifying both row counts and application consistency; that is a Phase 5
      task and it is tracked in release-readiness.yml as part of st-3.

support:
  hours: "business hours, single time zone, best effort"
  owner: pack-maintainer
  escalation: >-
    Application faults to the owning team; platform faults - gateway, warehouse,
    Lakebase - to the platform admin named in docs/11-admin-runbook.md. The
    reference application has no on-call rotation and does not pretend to.
  runbook: admin/runbooks/
